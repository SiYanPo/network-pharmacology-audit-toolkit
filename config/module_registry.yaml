# 模块注册表（module registry）
# status: entry（入口）/ core（DAG 主流程）/ audit（按需审计）/ manual（手动工具）/ deprecated（待移除）
# 规则：manual 必须写 when + min_cmd；deprecated 不得出现在新流程与文档的推荐路径。
