name: Bug report
description: Something in the pipeline, the audit layer or the demo does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: run `python -m pytest tests -q` and `bash demo/run_demo.sh`.
        If the demo passes but your case fails, the difference is usually in the input, not the code.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Command you ran, and the full error output (not a summary).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Toolkit version
      description: From `SKILL.md` front-matter or `CHANGELOG.md` (e.g. 3.0.18)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python / OS
      description: e.g. Python 3.13.14 on Windows 11; or the container tag
