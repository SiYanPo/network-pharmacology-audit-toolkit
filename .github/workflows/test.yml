name: tests

# 学术软件的基本要求：每次 push 都能证明"上一版能跑的东西这一版还能跑"。
# 三个层次：
#   unit        —— 纯函数单测（别名/decoy Z/MR/协同/基准指标/方向校验）
#   selftest    —— 每个模块自带的 selftest（回归护栏）
#   integration —— 用 examples/ 构造数据真跑一遍完整 DAG，再生成报告（防"单测全绿但流程崩"）

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy networkx pyyaml h5py matplotlib
      - name: Pytest
        run: pytest tests -q --maxfail=1

  windows-unit:
    # 评审 §7：Windows 路径/编码/子进程问题在 Linux-only CI 永远回归不到。
    name: unit / windows / py3.11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy networkx pyyaml h5py matplotlib
      - name: Pytest
        run: pytest tests -q --maxfail=1

  coverage-ratchet:
    # 评审 §6：不假装 55% 达标（当前 15%，逻辑多在 main() 里），改用棘轮：
    # 只断言"不低于基线 − 0.5 个百分点"，基线只允许上调。
    name: coverage (ratchet gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt numpy networkx pyyaml h5py matplotlib
      - name: Measure
        run: |
          python -m coverage run --source=scripts -m pytest tests -q
          python -m coverage report --skip-empty
          python -m coverage json -o coverage.json
          python tools/check_coverage.py --coverage coverage.json --baseline coverage_baseline.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.json

  selftest:
    name: module selftests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy networkx pyyaml h5py
      - name: Run selftests
        run: |
          set -e
          for m in np_mr np_synergy np_intervention np_benchmark np_lincs_local \
                   np_ortholog np_interactive np_mr_plots np_interpret np_uireport \
                   np_contraindication np_alias np_decoy np_pocket np_finalcheck \
                   np_evidence_ledger np_fdr np_split np_snapshot np_contracts \
                   np_ppi np_enrich np_intersect; do
            echo "== $m =="
            python scripts/$m.py --selftest
          done

  integration:
    name: end-to-end demo pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install numpy networkx pyyaml
      - name: Build demo inputs
        run: |
          mkdir -p ci_out
          printf '黄芪\n当归\n丹参\n' > ci_out/herbs.txt
          python - <<'PY'
          import json, os
          E = os.path.abspath("examples")
          cfg = {"inputs": {"herbs": "黄芪,当归,丹参", "herbs_file": "ci_out/herbs.txt",
                  "targets": os.path.join(E, "compound_targets.csv"),
                  "compounds": os.path.join(E, "compounds.csv"),
                  "disease": os.path.join(E, "disease_targets.tsv"),
                  "edges": os.path.join(E, "string_edges.tsv"),
                  "compound_edges": os.path.join(E, "compound_targets.csv"),
                  "dose": "", "gmt": os.path.join(E, "pathways.gmt")},
                 "params": {"label": "CI demo", "organism": "mouse"}}
          json.dump(cfg, open("ci_out/inputs.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Run DAG
        run: python scripts/np_pipeline.py --inputs ci_out/inputs.json -o ci_out/np_out --enable-funnel
      - name: Build report + gate
        run: |
          python scripts/np_finalcheck.py --dir ci_out/np_out --json ci_out/np_out/finalcheck.json || true
          python scripts/np_uireport.py --dir ci_out/np_out --label "CI demo" --verdict DRAFT
          python scripts/np_interactive.py --edges ci_out/np_out/05_ppi/ppi_edges_clean.tsv \
            --hubs ci_out/np_out/05_ppi/hubs.csv --core ci_out/np_out/04_intersect/intersection_genes.txt \
            -o ci_out/np_out/network_interactive.html
      - name: Contract + registry gates
        run: |
          python scripts/np_contracts.py check --dir ci_out/np_out
          python scripts/np_contracts.py coverage
          python scripts/np_evidence_ledger.py auto --dir ci_out/np_out
          python scripts/np_fdr.py run --dir ci_out/np_out
          python scripts/np_contracts.py check --dir ci_out/np_out
      - name: Assert key artifacts exist and are non-empty
        run: |
          set -e
          for f in pipeline_manifest.json 04_intersect/intersection_genes.txt 05_ppi/hubs.csv \
                   07_enrich/enrich_report.md ui_report.html dataflow_check.json \
                   09_evidence/evidence_ledger.csv 09_evidence/fdr_table.csv \
                   network_interactive.html; do
            test -s ci_out/np_out/$f || { echo "missing/empty: $f"; exit 1; }
          done
          echo "artifacts OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-report
          path: ci_out/np_out/*.html

  docker-demo:
    # 评审 §7：Dockerfile 必须"能构建且能跑通示例"，否则容器化只是文档里的承诺。
    # 构建期已在 Dockerfile 内做冒烟（工具版本 + preflight + 离线流水线 + 契约）；
    # 这里再在容器里跑一次 pytest，确认镜像内测试环境完整。
    name: docker image + in-container tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t np-pro:ci .
      - name: In-container pytest
        run: docker run --rm -w /work np-pro:ci python -m pytest tests -q --maxfail=1
      - name: In-container demo (offline)
        run: |
          docker run --rm -w /work np-pro:ci bash -lc "
            python scripts/np_pipeline.py --inputs examples/inputs.demo.json -o /tmp/o --offline &&
            python scripts/np_contracts.py check --dir /tmp/o &&
            python scripts/np_uireport.py --dir /tmp/o --label 'docker demo' --verdict DRAFT &&
            test -s /tmp/o/ui_report.html && echo DOCKER DEMO OK"
